<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style>
<title>מפת ההתקדמות של תורה וורלדוויד</title>
<style>
  :root {
    --ink:       #060910;
    --ink-2:     #0a0f1c;
    --panel:     #0d1526;
    --panel-hi:  #16203a;

    --gold:      #d8b45a;
    --gold-hi:   #f3d98f;
    --gold-deep: #8a6a26;
    --line:      rgba(216,180,90,0.16);
    --line-hi:   rgba(216,180,90,0.45);

    --green:     #57c98a;
    --green-hi:  #86e6ae;

    --text:      #e9e2d2;
    --muted:     #8a97b6;
    --muted-2:   #5d688a;

    --t-plat:    #7ad4e8;
    --t-gold:    #e0b74f;
    --t-silver:  #bcc6d6;
    --t-bronze:  #c08553;

    --wire:      rgba(216,180,90,0.34);
    --wire-lock: rgba(120,132,164,0.26);

    --f-display: "Frank Ruehl CLM", "FrankRuehl", "David Libre", "David", Georgia, serif;
    --f-body:    "Segoe UI", "Arial Hebrew", "Alef", system-ui, -apple-system, sans-serif;
    --f-mono:    "Cascadia Mono", "Consolas", ui-monospace, monospace;

    --tile:  76px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  /* dragging the board must never start a text selection or drag a sprite ghost */
  .viewport, .canvas, .hud, .hint, .zoomtag, .tip, .node, .band {
    -webkit-user-select: none;
    user-select: none;
  }
  .node { -webkit-tap-highlight-color: transparent; }
  img { -webkit-user-drag: none; user-drag: none; }
  /* the card stays selectable — its verbatim text is meant to be copied */
  .card, .card * { -webkit-user-select: text; user-select: text; }

  body {
    margin: 0;
    direction: rtl;
    font-family: var(--f-body);
    color: var(--text);
    background: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  /* ================= HUD ================= */

  .hud {
    position: fixed; inset-inline: 0; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 18px;
    padding: 12px 20px;
    background: linear-gradient(180deg, rgba(6,9,16,.96) 60%, rgba(6,9,16,0));
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }

  .hud h1 {
    margin: 0;
    font-family: var(--f-display);
    font-size: 20px; font-weight: 500;
    color: var(--gold-hi);
    white-space: nowrap;
  }

  .prog { flex: 1; max-width: 380px; min-width: 120px; }
  .prog .nums {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--f-mono); font-variant-numeric: tabular-nums;
    font-size: 12px; color: var(--muted); margin-bottom: 4px;
  }
  .prog .nums b { color: var(--green-hi); font-weight: 500; }
  .prog .nums .c { direction: ltr; }
  .prog .track {
    height: 6px; border-radius: 99px;
    background: var(--ink-2); border: 1px solid var(--line);
    overflow: hidden;
  }
  .prog .track i {
    display: block; height: 100%; width: 0; border-radius: 99px;
    background: linear-gradient(90deg, var(--green), var(--gold) 80%, var(--gold-hi));
    box-shadow: 0 0 10px rgba(216,180,90,.45);
    transition: width 1.4s cubic-bezier(.22,.9,.3,1) .3s;
  }

  .tallies { display: flex; gap: 6px; }
  .tally {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 10px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 3px; font-size: 11.5px; color: var(--muted);
    white-space: nowrap;
  }
  .tally b {
    font-family: var(--f-mono); font-variant-numeric: tabular-nums;
    color: var(--text); font-weight: 500; font-size: 13px;
  }
  .pip { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 7px currentColor; }
  .tp { color: var(--t-plat); } .tg { color: var(--t-gold); }
  .ts { color: var(--t-silver); } .tb { color: var(--t-bronze); }

  .hud button.ghost {
    font-family: inherit; font-size: 12px;
    padding: 7px 14px;
    color: var(--muted); background: var(--panel);
    border: 1px solid var(--line); border-radius: 3px;
    cursor: pointer; white-space: nowrap;
    transition: color .18s, border-color .18s, background .18s;
  }
  .hud button.ghost:hover { color: var(--gold-hi); border-color: var(--line-hi); background: var(--panel-hi); }
  .hud button.ghost:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ================= board ================= */

  .viewport {
    position: fixed; inset: 0; z-index: 1;
    overflow: hidden;
    cursor: grab;
    touch-action: none;          /* we own every touch gesture on the board */
    background-color: #070b14;
    background-image: var(--board-tex);
    background-size: 132px 132px;
    background-repeat: repeat;
  }
  .viewport::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(1200px 700px at 70% 40%, rgba(90,78,160,.20), transparent 70%),
      linear-gradient(180deg, rgba(6,9,16,.80), rgba(6,9,16,.62) 40%, rgba(6,9,16,.86));
  }
  .viewport.grabbing { cursor: grabbing; }

  /* left/top anchored on purpose: the pan maths is plain LTR pixel space even
     though the page is RTL, so translate() means the same thing everywhere. */
  .canvas {
    position: absolute; top: 0; left: 0;
    transform-origin: 0 0;
    z-index: 2;
  }
  /* NO persistent will-change here. The canvas is 2340x1740 CSS px; promoting it
     to its own layer means a ~27 megapixel texture on a 3x phone, which blows the
     GPU budget and makes Chrome checkerboard — black flashes while panning zoomed
     out. Promote only for the half-second recentre animation. */
  .canvas.snapping {
    will-change: transform;
    transition: transform .5s cubic-bezier(.22,.9,.3,1);
  }

  .wires { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; z-index: 1; }
  .wires path {
    fill: none;
    stroke: var(--wire);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .wires path.lock { stroke: var(--wire-lock); stroke-dasharray: 6 7; }
  .grow .wires path { stroke-dashoffset: var(--len); }
  .wires path { transition: stroke-dashoffset .75s ease var(--wd, 0ms); }

  /* ---- band labels ---- */
  .band {
    position: absolute;
    font-family: var(--f-display);
    font-size: 15px;
    color: var(--gold);
    opacity: .55;
    white-space: nowrap;
    letter-spacing: .04em;
    z-index: 2;
    pointer-events: none;
  }

  /* ---- tile ---- */

  .node {
    position: absolute;
    width: var(--tile); height: var(--tile);
    z-index: 3;
    padding: 0; margin: 0;
    background: none; border: 0;
    font: inherit; color: inherit;
    cursor: pointer;
    transition: transform .18s cubic-bezier(.22,.9,.3,1);
  }
  /* the grow-in is an animation, not a transition: a per-tile transition-delay
     would also delay the hover lift on deep tiles. */
  .node.pop { animation: pop .5s cubic-bezier(.22,.9,.3,1) backwards; animation-delay: var(--d, 0ms); }
  @keyframes pop { from { opacity: 0; transform: scale(.72); } to { opacity: 1; transform: none; } }
  .node:hover, .node:focus-visible { transform: translateY(-4px) scale(1.06); z-index: 6; outline: none; }

  .frame {
    position: relative;
    display: block;              /* it is a <span>; without this the 100% sizing is ignored */
    width: 100%; height: 100%;
    border: 3px solid var(--gold-deep);
    border-radius: 4px;
    overflow: hidden;
    background: #131b2e;
    box-shadow:
      inset 1px 1px 0 rgba(243,217,143,.28),
      inset -1px -1px 0 rgba(0,0,0,.6),
      0 3px 10px rgba(0,0,0,.55);
  }
  /* the klaf / limestone textures are LIGHT; without this the gold letters on top
     of them wash out completely. Dark slot, lit item — the Minecraft read. */
  .tex {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    opacity: .5;
  }
  .frame::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 38%, rgba(6,9,16,.22), rgba(6,9,16,.68) 78%);
  }
  .art {
    position: absolute; inset: 0; margin: auto;
    width: 46px; height: 46px;
    object-fit: contain;
  }
  .glyph {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-family: var(--f-display);
    font-size: 38px; line-height: 1;
    padding-bottom: 4px;
    background: linear-gradient(170deg, #fdf3cf 8%, #e8c470 40%, #b0872f 76%, #f7df9c 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    text-shadow: 0 1px 1px rgba(0,0,0,.8), 0 3px 12px rgba(0,0,0,.75);
  }

  .badge {
    position: absolute; inset-block-end: -1px; inset-inline-end: -1px;
    width: 20px; height: 20px;
    display: grid; place-items: center;
    border-start-start-radius: 4px;
    z-index: 2;
  }
  .badge svg { width: 12px; height: 12px; }
  .b-done { background: var(--green); }
  .b-done svg { color: #062615; }
  .b-lock { background: #2a3350; }
  .b-lock svg { color: #99a4bf; }

  /* tier framing — the frame itself carries the tier, Minecraft-style */
  .node[data-tier="bronze"]  .frame { border-color: #7d5527; }
  .node[data-tier="silver"]  .frame { border-color: #7c8698; }
  .node[data-tier="gold"]    .frame { border-color: #c19a3d; box-shadow: inset 1px 1px 0 rgba(243,217,143,.3), inset -1px -1px 0 rgba(0,0,0,.6), 0 0 14px rgba(216,180,90,.28), 0 3px 10px rgba(0,0,0,.55); }
  .node[data-tier="platinum"] .frame {
    border-color: var(--gold-hi); border-radius: 9px;
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.34), inset -1px -1px 0 rgba(0,0,0,.6),
                0 0 0 3px rgba(122,212,232,.30), 0 0 20px rgba(122,212,232,.32), 0 3px 12px rgba(0,0,0,.6);
  }

  /* opacity instead of filter(): grayscale/brightness on every locked tile is a
     per-frame raster cost that shows up as jank on a phone. */
  .node.locked .tex { opacity: .13; }
  .node.locked .art { opacity: .3; }
  .node.locked .glyph { background: linear-gradient(170deg, #8e9ab4, #5c6684); -webkit-background-clip: text; background-clip: text; opacity: .62; }
  .node.locked .frame { border-color: #39425c !important; box-shadow: inset 1px 1px 0 rgba(255,255,255,.06), inset -1px -1px 0 rgba(0,0,0,.55), 0 3px 8px rgba(0,0,0,.5) !important; }
  .node.locked[data-tier="platinum"] .frame { border-radius: 9px; }

  .node .num {
    position: absolute; top: -9px; inset-inline-start: -7px;
    min-width: 20px; height: 18px; padding: 0 5px;
    display: grid; place-items: center;
    font-family: var(--f-mono); font-size: 11px; font-variant-numeric: tabular-nums;
    color: #0a0f1c; background: var(--gold);
    border-radius: 3px;
    z-index: 3;
    box-shadow: 0 2px 5px rgba(0,0,0,.5);
  }

  .node .cap {
    position: absolute; top: calc(100% + 7px); inset-inline: -28px;
    text-align: center;
    font-size: 11.5px; line-height: 1.25;
    color: var(--muted);
    pointer-events: none;
    text-shadow: 0 2px 6px rgba(6,9,16,.95), 0 0 12px rgba(6,9,16,.8);
  }
  .node:hover .cap { color: var(--gold-hi); }
  .node.locked .cap { color: var(--muted-2); }

  /* ================= detail card ================= */

  .card {
    position: fixed; z-index: 40;
    inset-inline-start: 20px; bottom: 20px;
    width: min(390px, calc(100vw - 40px));
    background: linear-gradient(180deg, rgba(16,23,40,.98), rgba(9,14,26,.98));
    border: 1px solid var(--line-hi);
    border-radius: 5px;
    padding: 16px;
    box-shadow: 0 18px 44px rgba(0,0,0,.66);
    display: none;
    animation: cardIn .22s cubic-bezier(.22,.9,.3,1);
  }
  .card.open { display: block; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .card .top { display: flex; gap: 13px; align-items: flex-start; }
  .card .mini { width: 60px; height: 60px; flex: none; }
  .card h2 {
    margin: 0 0 3px;
    font-family: var(--f-display); font-size: 20px; font-weight: 500; line-height: 1.2;
    color: var(--text);
  }
  .card .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 11.5px; }
  .card .tier { display: flex; align-items: center; gap: 5px; letter-spacing: .06em; }
  .card .tier .pip { width: 7px; height: 7px; }
  .card time { font-family: var(--f-mono); color: var(--green); font-variant-numeric: tabular-nums; }
  .card .lockedtag { font-family: var(--f-mono); color: var(--muted-2); }
  .card p { margin: 12px 0 0; font-size: 13.5px; color: var(--muted); }
  /* A locked item that WAS worked on and stopped short of done. The tile stays
     locked — the trophy is not earned — but the card has to say why, or a later
     session re-litigates a question already answered. */
  .card .partial {
    margin-top: 12px; padding: 9px 11px;
    border: 1px solid rgba(216,180,90,.22); border-radius: 8px;
    background: rgba(216,180,90,.05);
  }
  .card .plabel {
    display: block; font-size: 10px; letter-spacing: .18em;
    color: var(--gold); opacity: .85; margin-bottom: 6px;
  }
  .card .partial p {
    margin: 0 0 6px; font-size: 12px; line-height: 1.6; color: var(--muted-2);
  }
  .card .partial p:last-child { margin-bottom: 0; }
  .card .verbatim {
    margin-top: 12px; padding-top: 11px;
    border-top: 1px solid rgba(216,180,90,.16);
  }
  .card .vlabel {
    display: block; font-size: 10px; letter-spacing: .18em;
    color: var(--gold); opacity: .8; margin-bottom: 5px;
  }
  /* scroll on the <q> itself, in LTR, so the scrollbar lands to the right of the
     English instead of on top of it the way the RTL card would put it */
  .card .verbatim q {
    display: block; direction: ltr; text-align: left;
    font-size: 12px; line-height: 1.55; color: var(--muted-2);
    quotes: none;
    max-height: 150px; overflow-y: auto;
    padding-inline-end: 8px;
  }
  .card .close {
    position: absolute; top: 8px; inset-inline-start: 8px;
    width: 26px; height: 26px; display: grid; place-items: center;
    background: none; border: 0; color: var(--muted-2);
    font-size: 17px; cursor: pointer; border-radius: 3px; line-height: 1;
  }
  .card .close:hover { color: var(--gold-hi); background: rgba(216,180,90,.10); }

  /* ---- hover tooltip: the task in plain words ---- */

  .tip {
    position: fixed; z-index: 45;
    width: 300px; max-width: calc(100vw - 24px);
    padding: 12px 14px;
    background: linear-gradient(180deg, rgba(17,24,42,.985), rgba(9,14,26,.985));
    border: 1px solid var(--line-hi);
    border-radius: 5px;
    box-shadow: 0 14px 34px rgba(0,0,0,.7);
    opacity: 0; visibility: hidden;
    transform: translateY(5px);
    transition: opacity .14s ease, transform .14s ease, visibility .14s;
    pointer-events: none;
  }
  .tip.on { opacity: 1; visibility: visible; transform: none; }
  /* belt and braces: on any device with no real hover, the tooltip never renders */
  @media (hover: none) { .tip { display: none !important; } }
  .tip .tname {
    font-family: var(--f-display); font-size: 17px; font-weight: 500;
    color: var(--gold-hi); line-height: 1.25; margin-bottom: 3px;
  }
  .tip .tmeta {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 11px; color: var(--muted-2); margin-bottom: 7px;
  }
  .tip .tmeta .pip { width: 6px; height: 6px; }
  .tip .tmeta time { color: var(--green); font-family: var(--f-mono); }
  .tip .tbody { font-size: 13px; color: var(--text); opacity: .92; }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip-path: inset(50%); border: 0;
  }

  .hint {
    position: fixed; z-index: 25; bottom: 18px; inset-inline-end: 20px;
    font-size: 11.5px; color: var(--muted-2);
    pointer-events: none;
    display: flex; align-items: center; gap: 7px;
    text-shadow: 0 2px 8px rgba(6,9,16,.9);
    transition: opacity .4s ease;
  }
  .hint.gone { opacity: 0; }

  .zoomtag {
    position: fixed; z-index: 26; bottom: 18px; inset-inline-start: 20px;
    font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums;
    color: var(--gold); background: rgba(9,14,26,.9);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 5px 10px;
    opacity: 0; transition: opacity .25s ease;
    pointer-events: none;
  }
  .zoomtag.on { opacity: 1; }

  /* zoomed far out the captions become noise — drop to the shape of the tree */
  body.far .node .cap { opacity: 0; }
  .node .cap { transition: opacity .2s ease; }
  body.far .band { opacity: .8; }

  @media (max-width: 720px) {
    .hud { flex-wrap: wrap; gap: 10px 12px; padding: 10px 14px; }
    .hud h1 { font-size: 16px; }
    .tallies { order: 3; width: 100%; }
    .prog { max-width: none; }
    .card { inset-inline: 12px; width: auto; bottom: 12px; }
    .hint { font-size: 10.5px; bottom: 10px; inset-inline-end: 12px; }
    .zoomtag { bottom: 10px; inset-inline-start: 12px; padding: 4px 8px; }
  }

  @media (max-width: 560px) {
    .tallies { display: none; }          /* the bar already carries the progress */
    .hud h1 { font-size: 15px; }
    .hud button.ghost { padding: 6px 10px; font-size: 11.5px; }
    .card .top { gap: 10px; }
    .card h2 { font-size: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .node.pop { animation: none; }
    .grow .wires path { stroke-dashoffset: 0; }
    * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 12.6l5 5 10-11"/>
  </symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <rect x="5" y="10.4" width="14" height="10.1" rx="2.2"/><path d="M8.4 10.4V7.6a3.6 3.6 0 0 1 7.2 0v2.8"/>
  </symbol>
  <symbol id="i-hand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 11V5.6a1.6 1.6 0 0 1 3.2 0V11"/>
    <path d="M12.2 11V4.4a1.6 1.6 0 0 1 3.2 0V11"/>
    <path d="M15.4 11.4V6.8a1.6 1.6 0 0 1 3.2 0v7.4c0 4-2.7 6.6-6.4 6.6-3 0-4.5-1.3-6.2-4.2l-2-3.4a1.6 1.6 0 0 1 2.6-1.8L9 13.6V11"/>
  </symbol>
</svg>

<header class="hud">
  <h1>מפת ההתקדמות</h1>
  <div class="prog">
    <div class="nums"><span class="c"><b id="p-done">0</b> / <span id="p-total">0</span></span><span id="p-pct">0%</span></div>
    <div class="track"><i id="p-fill"></i></div>
  </div>
  <div class="tallies" id="tallies"></div>
  <button class="ghost" id="ai-copy">בריף מלא ל־AI</button>
  <button class="ghost" id="recenter">מרכוז המפה</button>
</header>

<div class="tip" id="tip">
  <div class="tname" id="tip-name"></div>
  <div class="tmeta" id="tip-meta"></div>
  <div class="tbody" id="tip-body"></div>
</div>

<div class="viewport" id="viewport">
  <div class="canvas" id="canvas">
    <svg class="wires" id="wires"></svg>
  </div>
</div>

<div class="hint" id="hint"><svg style="width:15px;height:15px" aria-hidden="true"><use href="#i-hand"></use></svg> <span id="hint-text">גררו את הלוח · Ctrl+גלילה מרחיק · ריחוף מסביר</span></div>
<div class="zoomtag" id="zoomtag">100%</div>

<div class="card" id="card">
  <button class="close" id="card-close" aria-label="סגירה">✕</button>
  <div class="top">
    <div class="mini" id="card-mini"></div>
    <div>
      <h2 id="card-name"></h2>
      <div class="meta" id="card-meta"></div>
    </div>
  </div>
  <p id="card-desc"></p>
</div>

<script>

  /* ============ the data ============

    })

  /* Everything below is the original board code, unchanged, now run once the
     data has arrived. ROOT / BRANCHES / VERBATIM keep their original names. */
  function init(ROOT, BRANCHES, VERBATIM) {

  var TIER_LABEL = { platinum:"פלטינה", gold:"זהב", silver:"כסף", bronze:"ארד" };
  var TIER_CLASS = { platinum:"tp", gold:"tg", silver:"ts", bronze:"tb" };

  var COL = 150, ROW = 150, TILE = 76;
  var PAD_X = 120, PAD_Y = 120;

  /* ---------- flatten + place ---------- */

  var nodes = {}, all = [];

  ROOT.depth = 0; ROOT.row = 0; ROOT.parent = null;
  nodes.root = ROOT; all.push(ROOT);

  var b, i, prev, n;

    var br = BRANCHES[b];
    var anchor = nodes[br.from];
    prev = anchor;
    for (i = 0; i < br.nodes.length; i++) {

      n.depth = (i === 0 ? anchor.depth : prev.depth) + 1;
      n.row = br.row;
      n.parent = prev.id;
      n.branch = br.label;
      if (!n.tex) n.tex = br.tex;

      var vkey = n.lock || n.was;
      if (vkey && VERBATIM[vkey]) n.full = VERBATIM[vkey];

  var wires = document.getElementById("wires");

    var path = svgEl("path");
    path.setAttribute("d", d);
    if (n.lock) path.setAttribute("class", "lock");
    wires.appendChild(path);
    var len = path.getTotalLength();
    path.style.setProperty("--len", len);
    path.style.strokeDasharray = n.lock ? "6 7" : len;
    path.style.setProperty("--wd", (n.depth * 70) + "ms");
    n._wire = path;
  }

  /* band labels */
  for (b = 0; b < BRANCHES.length; b++) {
    var lab = document.createElement("div");
    lab.className = "band";
    lab.textContent = BRANCHES[b].label;
    lab.style.top = (PAD_Y + (BRANCHES[b].row - minRow) * ROW + ROW / 2 - 42) + "px";
    lab.style.right = (PAD_X - 96) + "px";
    canvas.appendChild(lab);
  }

  function slotHTML(node, cls) {
    var inner = "";
    if (node.art && SPRITES[node.art]) {
      inner = '<img class="art" draggable="false" src="' + SPRITES[node.art] + '" alt="">';
    } else {
      inner = '<span class="glyph">' + (node.glyph || "•") + '</span>';
    }
    var tex = SPRITES[node.tex] ? '<span class="tex" style="background-image:url(' + SPRITES[node.tex] + ')"></span>' : "";
    var badge = node.lock
      ? '<span class="badge b-lock"><svg><use href="#i-lock"></use></svg></span>'
      : '<span class="badge b-done"><svg><use href="#i-check"></use></svg></span>';
    return '<span class="frame ' + (cls || "") + '">' + tex + inner + badge + '</span>';
  }

  for (i = 0; i < all.length; i++) {
    n = all[i];
    var el = document.createElement("button");
    el.className = "node pop" + (n.lock ? " locked" : "");
    el.setAttribute("data-tier", n.tier);
    el.setAttribute("type", "button");
    el.style.right = (W - nx(n) - TILE) + "px";
    el.style.top = ny(n) + "px";
    el.style.setProperty("--d", (n.depth * 70) + "ms");
    el.innerHTML =
      (n.lock ? '<span class="num">' + (n.lock < 10 ? "0" + n.lock : n.lock) + '</span>' : "") +
      slotHTML(n) +
      '<span class="cap">' + n.name + '</span>';
    el.addEventListener("click", (function (node) {
      return function (ev) { ev.stopPropagation(); openCard(node); };
    })(n));
    el.addEventListener("mouseenter", (function (node) {
      return function () { showTip(node, this); };
    })(n));
    el.addEventListener("mouseleave", hideTip);
    el.addEventListener("focus", (function (node) {
      return function () { showTip(node, this); };
    })(n));
    el.addEventListener("blur", hideTip);
    canvas.appendChild(el);
    n._el = el;
  }

  /* ---------- hover tooltip ---------- */

  var tip = document.getElementById("tip");

  function showTip(node, el) {
    if (dragging) return;
    /* A tap on a touch screen still fires mouseenter (and focus) for compatibility,
       which would open the tooltip on top of the tile AND the card at the bottom.
       On a touch device the card is the only explanation we want. */
    if (lastPointerType === "touch" || lastPointerType === "pen") return;
    if (window.matchMedia && window.matchMedia("(hover: none)").matches) return;
    document.getElementById("tip-name").textContent = node.name;
    var meta = '<span class="tier ' + TIER_CLASS[node.tier] + '"><span class="pip"></span>' + TIER_LABEL[node.tier] + '</span>';
    meta += node.lock
      ? '<span>נעול · פריט ' + node.lock + '</span>'
      : '<time>' + node.date.split("-").reverse().join(".") + '</time>';
    meta += '<span>' + (node.branch || "השורש") + '</span>';
    document.getElementById("tip-meta").innerHTML = meta;
    document.getElementById("tip-body").textContent = node.desc;
    tip.classList.add("on");

    var r = el.getBoundingClientRect();
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    var left = r.left + r.width / 2 - tw / 2;
    left = Math.max(12, Math.min(window.innerWidth - tw - 12, left));
    var top = r.top - th - 12;
    if (top < 70) top = r.bottom + 12;                     /* flip under the tile */
    if (top + th > window.innerHeight - 12) top = Math.max(70, window.innerHeight - th - 12);
    tip.style.left = left + "px";
    tip.style.top = top + "px";
  }

  function hideTip() { tip.classList.remove("on"); }

  /* ---------- detail card ---------- */

  var card = document.getElementById("card");

  /* textContent, never innerHTML — the status lines are Hebrew prose and must
     never be parsed as markup. */
  function el2(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  function openCard(node) {
    document.getElementById("card-mini").innerHTML = slotHTML(node);
    document.getElementById("card-name").textContent = node.name;
    var meta = '<span class="tier ' + TIER_CLASS[node.tier] + '"><span class="pip"></span>' + TIER_LABEL[node.tier] + '</span>';
    meta += node.lock
      ? '<span class="lockedtag">נעול · פריט ' + node.lock + '</span>'
      : '<time>' + node.date.split("-").reverse().join(".") + '</time>';
    if (node.status) meta += '<span class="lockedtag">חלקי</span>';
    if (node.branch) meta += '<span class="lockedtag">' + node.branch + '</span>';
    document.getElementById("card-meta").innerHTML = meta;
    var d = document.getElementById("card-desc");
    d.textContent = node.desc;
    var oldp = card.querySelector(".partial");
    if (oldp) oldp.parentNode.removeChild(oldp);
    var old = card.querySelector(".verbatim");
    if (old) old.parentNode.removeChild(old);
    if (node.status) {
      var s = document.createElement("div");
      s.className = "partial";
      s.appendChild(el2("span", "plabel", "מה נעשה ומה נשאר"));
      for (var si = 0; si < node.status.length; si++) {
        s.appendChild(el2("p", null, node.status[si]));
      }
      card.appendChild(s);
    }
    if (node.full) {
      var v = document.createElement("div");
      v.className = "verbatim";
      v.innerHTML = '<span class="vlabel">במילים שלך</span>' +
                    '<q dir="ltr"></q>';
      v.querySelector("q").textContent = node.full;
      card.appendChild(v);
    }
    card.classList.add("open");
  }

  document.getElementById("card-close").addEventListener("click", function () {
    card.classList.remove("open");
  });

  /* ---------- HUD ---------- */

  var done = 0, tally = { platinum:0, gold:0, silver:0, bronze:0 };
  for (i = 0; i < all.length; i++) {
    if (!all[i].lock) { done++; tally[all[i].tier]++; }
  }
  var pct = Math.round(done / all.length * 100);
  document.getElementById("p-done").textContent = done;
  document.getElementById("p-total").textContent = all.length;
  document.getElementById("p-pct").textContent = pct + "%";
  setTimeout(function () { document.getElementById("p-fill").style.width = pct + "%"; }, 120);

  var tbox = document.getElementById("tallies"), order = ["platinum","gold","silver","bronze"];
  for (i = 0; i < order.length; i++) {
    var sp = document.createElement("span");
    sp.className = "tally " + TIER_CLASS[order[i]];
    sp.innerHTML = '<span class="pip"></span><b>' + tally[order[i]] + '</b> ' + TIER_LABEL[order[i]];
    tbox.appendChild(sp);
  }

  document.documentElement.style.setProperty("--board-tex", "url(" + SPRITES.night + ")");

  /* ---------- pan ---------- */

  var vp = document.getElementById("viewport");
  var px = 0, py = 0, z = 1;
  var Z_MIN = 0.3, Z_MAX = 1.5;
  var dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;

  function apply() {
    canvas.style.transform = "translate(" + px + "px," + py + "px) scale(" + z + ")";
    document.body.classList.toggle("far", z < 0.62);
  }

  function clamp() {
    var vw = vp.clientWidth, vh = vp.clientHeight;
    var cw = W * z, ch = H * z;
    var minX = Math.min(0, vw - cw) - 60, maxX = 60;
    var minY = Math.min(0, vh - ch) - 60, maxY = 60;
    if (cw < vw) { minX = maxX = (vw - cw) / 2; }
    if (ch < vh) { minY = maxY = (vh - ch) / 2; }
    px = Math.max(minX, Math.min(maxX, px));
    py = Math.max(minY, Math.min(maxY, py));
  }

  /* zoom toward a point in viewport space, so the tile under the cursor stays put */
  function zoomAt(nz, cx, cy) {
    nz = Math.max(Z_MIN, Math.min(Z_MAX, nz));
    if (nz === z) return;
    px = cx - (cx - px) * (nz / z);
    py = cy - (cy - py) * (nz / z);
    z = nz;
    clamp(); apply();
    showZoom();
  }

  function goHome(animate) {
    var vw = vp.clientWidth, vh = vp.clientHeight;
    /* on a phone, 100% shows barely two tiles — open wider, but never so far out
       that the captions drop away (they hide below 0.62). */
    z = vw < 720 ? Math.max(0.62, Math.min(1, vw / 560)) : 1;
    px = vw - W * z - 10;                   /* root sits at the right edge */
    py = vh / 2 - (ny(ROOT) + TILE / 2) * z;
    clamp();
    if (animate) {
      canvas.classList.add("snapping");
      setTimeout(function () { canvas.classList.remove("snapping"); }, 520);
    }
    apply();
  }

  var zoomTag = document.getElementById("zoomtag"), zoomTimer = null;
  function showZoom() {
    zoomTag.textContent = Math.round(z * 100) + "%";
    zoomTag.classList.add("on");
    clearTimeout(zoomTimer);
    zoomTimer = setTimeout(function () { zoomTag.classList.remove("on"); }, 1100);
  }

  /* One finger (or the mouse) pans; two fingers pinch-zoom. Pointer events cover
     both, so there is no separate touch path. */

  var pts = {}, ptCount = 0;
  var pinchDist = 1, pinchZ = 1, pinchCx = 0, pinchCy = 0;
  var lastPointerType = "mouse";   /* pointerdown lands before the compat mouseenter */

  function ptList() {
    var a = [], k;
    for (k in pts) if (pts.hasOwnProperty(k)) a.push(pts[k]);
    return a;
  }

  function startPinch() {
    var a = ptList();
    if (a.length < 2) return;
    var dx = a[0].x - a[1].x, dy = a[0].y - a[1].y;
    pinchDist = Math.sqrt(dx * dx + dy * dy) || 1;
    pinchZ = z;
    var r = vp.getBoundingClientRect();
    pinchCx = (a[0].x + a[1].x) / 2 - r.left;
    pinchCy = (a[0].y + a[1].y) / 2 - r.top;
  }

  vp.addEventListener("pointerdown", function (e) {
    lastPointerType = e.pointerType || "mouse";
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (!pts[e.pointerId]) ptCount++;
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    hideTip();
    if (ptCount === 1) {
      dragging = true; moved = false;
      sx = e.clientX; sy = e.clientY; ox = px; oy = py;
      vp.classList.add("grabbing");
      try { vp.setPointerCapture(e.pointerId); } catch (err) {}
    } else if (ptCount === 2) {
      dragging = false;
      vp.classList.remove("grabbing");
      startPinch();
    }
  });

  vp.addEventListener("pointermove", function (e) {
    if (!pts[e.pointerId]) return;
    pts[e.pointerId].x = e.clientX;
    pts[e.pointerId].y = e.clientY;

    if (ptCount >= 2) {
      var a = ptList();
      var dx = a[0].x - a[1].x, dy = a[0].y - a[1].y;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      moved = true; hideHint();
      zoomAt(pinchZ * (d / pinchDist), pinchCx, pinchCy);
      return;
    }
    if (!dragging) return;
    var mx = e.clientX - sx, my = e.clientY - sy;
    if (Math.abs(mx) + Math.abs(my) > 4) { moved = true; hideHint(); }
    px = ox + mx; py = oy + my;
    clamp(); apply();
  });

  function endPan(e) {
    if (pts[e.pointerId]) { delete pts[e.pointerId]; ptCount--; }
    if (ptCount < 0) ptCount = 0;
    if (ptCount === 1) {
      /* a finger lifted out of a pinch — hand panning to the one still down */
      var a = ptList();
      sx = a[0].x; sy = a[0].y; ox = px; oy = py;
      dragging = true;
    } else if (ptCount === 0) {
      dragging = false;
      vp.classList.remove("grabbing");
      try { vp.releasePointerCapture(e.pointerId); } catch (err) {}
    }
  }
  vp.addEventListener("pointerup", endPan);
  vp.addEventListener("pointercancel", endPan);

  /* With text unselectable, Chrome happily starts a NATIVE element drag instead —
     that is the ghost image, and it also swallows the pointermove stream so the
     pan dies mid-gesture. Refuse it outright. */
  vp.addEventListener("dragstart", function (e) { e.preventDefault(); });

  vp.addEventListener("click", function () { if (!moved) card.classList.remove("open"); });

  vp.addEventListener("wheel", function (e) {
    e.preventDefault();
    hideHint(); hideTip();
    if (e.ctrlKey || e.metaKey) {                 /* ctrl+scroll = zoom out / in */
      var r = vp.getBoundingClientRect();
      var factor = Math.pow(0.9986, e.deltaY);    /* smooth, direction follows the wheel */
      zoomAt(z * factor, e.clientX - r.left, e.clientY - r.top);
      return;
    }
    if (e.shiftKey) { px -= e.deltaY; } else { py -= e.deltaY; px -= e.deltaX; }
    clamp(); apply();
  }, { passive: false });

  window.addEventListener("keydown", function (e) {
    var step = e.shiftKey ? 240 : 90, hit = true;
    if (e.key === "ArrowLeft") px += step;
    else if (e.key === "ArrowRight") px -= step;
    else if (e.key === "ArrowUp") py += step;
    else if (e.key === "ArrowDown") py -= step;
    else if (e.key === "+" || e.key === "=") { zoomAt(z * 1.2, vp.clientWidth / 2, vp.clientHeight / 2); hit = false; e.preventDefault(); }
    else if (e.key === "-" || e.key === "_") { zoomAt(z / 1.2, vp.clientWidth / 2, vp.clientHeight / 2); hit = false; e.preventDefault(); }
    else if (e.key === "Escape") { card.classList.remove("open"); hideTip(); hit = false; }
    else hit = false;
    if (hit) { e.preventDefault(); clamp(); apply(); hideHint(); }
  });

  window.addEventListener("resize", function () { clamp(); apply(); });
  document.getElementById("recenter").addEventListener("click", function () { goHome(true); });

  if (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) {
    document.getElementById("hint-text").textContent = "גררו את הלוח · צביטה לזום · הקישו על אריח";
  }

  var hintEl = document.getElementById("hint"), hintGone = false;
  function hideHint() {
    if (hintGone) return;
    hintGone = true;
    hintEl.classList.add("gone");
  }
  setTimeout(hideHint, 9000);

  /* ---------- the AI layer ----------
     Everything a model needs to work on this project, in one block: the short
     plain-language version AND Tomer's untouched original wording. It is put
     into the live DOM (visually hidden) so anything that reads this page —
     rendered text or raw source — gets the whole brief, not the captions. */

  function buildBrief() {
    var L = [];
    L.push("TORAH WORLDWIDE — PROGRESS MAP");
    L.push("Live site: https://www.torah-worldwide.com");
    L.push("Code: github.com/TorahWorldWide/TorahWorldwide-v2 (private) -> VM /home/ubuntu/TorahWorldwide-v2 -> Vercel.");
    L.push("WARNING: every Torah-reader folder on Tomer's PC is a dead v1. Do not work there.");
    L.push("Progress: " + done + " of " + all.length + " done (" + pct + "%).");
    L.push("Working method: ONE item at a time, finished perfectly, reviewed by Tomer on the live site, only then the next.");
    L.push("Item numbers below are stable and are how Tomer refers to work (\"let's do 6\").");
    L.push("");
    L.push("=== OPEN ITEMS (locked) ===");
    var i, n;
    for (i = 0; i < all.length; i++) {
      n = all[i];
      if (!n.lock) continue;
      L.push("");
      L.push("#" + n.lock + " — " + n.name + "  [tier: " + n.tier + " | branch: " + n.branch + "]");
      L.push("  short: " + n.desc);
      if (n.status) {
        L.push("  PARTIAL — worked on, not finished. Read before touching this item:");
        for (var si = 0; si < n.status.length; si++) L.push("    - " + n.status[si]);
      }
      if (n.full) L.push("  TOMER'S ORIGINAL WORDS: " + n.full);
    }
    L.push("");
    L.push("=== ALREADY DONE (unlocked, by date) ===");
    var dn = [];
    for (i = 0; i < all.length; i++) if (!all[i].lock) dn.push(all[i]);
    dn.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    for (i = 0; i < dn.length; i++) {
      n = dn[i];
      L.push(n.date + "  " + n.name + "  [" + n.tier + " | " + (n.branch || "root") + "] — " + n.desc);
    }
    return L.join("\n");
  }

  var BRIEF = buildBrief();

  var srBox = document.createElement("section");
  srBox.className = "sr-only";
  srBox.setAttribute("aria-label", "Full project brief for AI assistants");
  var pre = document.createElement("pre");
  pre.textContent = BRIEF;
  srBox.appendChild(pre);
  document.body.appendChild(srBox);

  var aiBtn = document.getElementById("ai-copy");
  aiBtn.addEventListener("click", function () {
    var ok = false;
    try {
      var ta = document.createElement("textarea");
      ta.value = BRIEF;
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand("copy");
      document.body.removeChild(ta);
    } catch (err) { ok = false; }
    if (!ok && navigator.clipboard) {
      navigator.clipboard.writeText(BRIEF).then(function () { flash("הועתק ✓"); },
                                                function () { flash("ההעתקה נחסמה"); });
      return;
    }
    flash(ok ? "הועתק ✓" : "ההעתקה נחסמה");
  });

  function flash(msg) {
    var was = aiBtn.textContent;
    aiBtn.textContent = msg;
    setTimeout(function () { aiBtn.textContent = was; }, 1600);
  }

  /* ---------- grow ---------- */

  goHome(false);
  setTimeout(function () {
    document.body.classList.remove("grow");
    for (var j = 0; j < all.length; j++) {
      if (all[j]._wire) all[j]._wire.style.strokeDashoffset = "0";
    }
  }, 80);
  }
})();
</script>
</body>
</html>
